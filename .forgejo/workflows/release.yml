name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-aarch64
            runs-on: macos-15
            target: aarch64-apple-darwin
          - name: darwin-x86_64
            runs-on: macos-15
            target: x86_64-apple-darwin
          - name: linux-x86_64
            runs-on: docker
            container: catthehacker/ubuntu:act-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    # Cargo cache (fsn1) + release artifacts (hel1) on our own S3. Hetzner needs
    # virtual-hosted addressing, so path-style is off for both namespaces.
    env:
      FJ_APPLE_DEVELOPER_ID: 'Developer ID Application: Raster & State LLC (62Y3FRM8PD)'
      RASTER_CACHE_S3_BUCKET:                ${{ vars.RASTER_CACHE_S3_BUCKET }}
      RASTER_CACHE_S3_ENDPOINT:              ${{ vars.RASTER_CACHE_S3_ENDPOINT }}
      RASTER_CACHE_S3_REGION:                ${{ vars.RASTER_CACHE_S3_REGION }}
      RASTER_CACHE_S3_FORCE_PATH_STYLE:      "false"
      RASTER_CACHE_S3_ACCESS_KEY_ID:         ${{ secrets.SCCACHE_AWS_KEY_ID }}
      RASTER_CACHE_S3_SECRET_ACCESS_KEY:     ${{ secrets.SCCACHE_AWS_SECRET_KEY }}
      RASTER_ARTIFACTS_S3_BUCKET:            ${{ vars.RASTER_ARTIFACTS_S3_BUCKET }}
      RASTER_ARTIFACTS_S3_ENDPOINT:          ${{ vars.RASTER_ARTIFACTS_S3_ENDPOINT }}
      RASTER_ARTIFACTS_S3_REGION:            ${{ vars.RASTER_ARTIFACTS_S3_REGION }}
      RASTER_ARTIFACTS_S3_FORCE_PATH_STYLE:  "false"
      RASTER_ARTIFACTS_S3_ACCESS_KEY_ID:     ${{ secrets.SCCACHE_AWS_KEY_ID }}
      RASTER_ARTIFACTS_S3_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Installs rustup from rustup.rs when absent (the linux container has
      # none; macOS runners already have it) and adds the cross-compile target.
      - name: setup rust
        uses: https://rasterhub.com/rasterstate/setup-rust-action@v1.0.1
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: https://rasterhub.com/rasterstate/rust-cache-action@v1
        with:
          prefix-key: release
          key: ${{ matrix.target }}

      - name: build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      # ── macOS: import cert into a temporary keychain ────────────────────────
      # Pattern from Apple's own docs: build a throwaway keychain per job, drop
      # the .p12 into it, allow codesign access without a password prompt, and
      # delete the whole thing at the end. The job-scoped keychain never
      # leaks the cert beyond this run.
      - name: setup signing keychain
        if: contains(matrix.name, 'darwin')
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/fj-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: sign binary
        if: contains(matrix.name, 'darwin')
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/fj"
          codesign --force \
            --sign "$FJ_APPLE_DEVELOPER_ID" \
            --timestamp \
            --options=runtime \
            "$BIN"
          codesign --verify --verbose=2 "$BIN"

      - name: package
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/fj
          test -x "$BIN" || (echo "binary missing"; exit 1)
          STAGE=fj-${{ github.ref_name }}-${{ matrix.name }}
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          cp README.md LICENSE CHANGELOG.md "$STAGE/"
          tar czf "dist/$STAGE.tar.gz" "$STAGE"
          (cd dist && shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256")

      # ── macOS: notarize the signed binary ───────────────────────────────────
      # Apple's notary records the binary hash, not the tarball hash, so the
      # .tar.gz on disk (and its SHA256SUMS entry) stays bit-identical after
      # this step. We submit a zip of the signed binary and block until Apple
      # responds. Failures dump the rejection log and fail the job.
      - name: notarize binary
        if: contains(matrix.name, 'darwin')
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/api-key.p8"
          ZIP="$RUNNER_TEMP/fj-notary.zip"
          cleanup_notary() {
            rm -f "$KEY_PATH" "$ZIP"
          }
          trap cleanup_notary EXIT

          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          BIN="target/${{ matrix.target }}/release/fj"
          (cd "$(dirname "$BIN")" && zip -q "$ZIP" "$(basename "$BIN")")

          out=$(xcrun notarytool submit "$ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --output-format json)
          echo "$out"
          n_status=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          req_id=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')

          if [ "$n_status" != "Accepted" ]; then
            echo "::error::notarization failed: $n_status (request $req_id)"
            xcrun notarytool log "$req_id" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi

      - name: cleanup keychain
        if: always() && contains(matrix.name, 'darwin')
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: upload artifacts
        uses: https://rasterhub.com/rasterstate/upload-artifact-action@v1
        with:
          name: fj-${{ matrix.name }}
          path: dist/*
          retention-days: 7
          overwrite: true

  publish:
    needs: build
    runs-on: docker
    container: alpine:3.20
    # Release artifacts live on our own S3 (hel1). download-artifact-action
    # shells out to tar + zstd/gzip, none of which busybox alpine ships, so
    # they are installed below alongside the release tooling.
    env:
      RASTER_ARTIFACTS_S3_BUCKET:            ${{ vars.RASTER_ARTIFACTS_S3_BUCKET }}
      RASTER_ARTIFACTS_S3_ENDPOINT:          ${{ vars.RASTER_ARTIFACTS_S3_ENDPOINT }}
      RASTER_ARTIFACTS_S3_REGION:            ${{ vars.RASTER_ARTIFACTS_S3_REGION }}
      RASTER_ARTIFACTS_S3_FORCE_PATH_STYLE:  "false"
      RASTER_ARTIFACTS_S3_ACCESS_KEY_ID:     ${{ secrets.SCCACHE_AWS_KEY_ID }}
      RASTER_ARTIFACTS_S3_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_KEY }}
    steps:
      - name: install tools
        # nodejs is required by the JS actions in this job (download-artifact,
        # forgejo-release); the bare alpine image doesn't ship it.
        run: apk add --no-cache coreutils bash tar zstd gzip nodejs

      - name: fetch artifacts
        uses: https://rasterhub.com/rasterstate/download-artifact-action@v1
        with:
          path: dist
          merge-multiple: true

      - name: combined SHA256SUMS
        run: |
          cd dist
          ls -la
          # Concatenate per-artifact sha256 files into a single SHA256SUMS.
          cat *.sha256 | sort > SHA256SUMS
          cat SHA256SUMS

      - name: render homebrew formula
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          HOST: ${{ github.server_url }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          ARM_SHA=$(awk '/darwin-aarch64\.tar\.gz$/{print $1}' dist/SHA256SUMS)
          X64_SHA=$(awk '/darwin-x86_64\.tar\.gz$/{print $1}' dist/SHA256SUMS)
          LIN_SHA=$(awk '/linux-x86_64\.tar\.gz$/{print $1}' dist/SHA256SUMS)
          BASE="$HOST/$REPO/releases/download/$TAG"
          mkdir -p homebrew-out
          cat > homebrew-out/fj.rb <<RUBY
          class Fj < Formula
            desc "Command-line tool for Forgejo, in the spirit of gh"
            homepage "$HOST/$REPO"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "$BASE/fj-$TAG-darwin-aarch64.tar.gz"
                sha256 "$ARM_SHA"
              end
              on_intel do
                url "$BASE/fj-$TAG-darwin-x86_64.tar.gz"
                sha256 "$X64_SHA"
              end
            end

            on_linux do
              on_intel do
                url "$BASE/fj-$TAG-linux-x86_64.tar.gz"
                sha256 "$LIN_SHA"
              end
            end

            def install
              target = if OS.mac?
                Hardware::CPU.arm? ? "darwin-aarch64" : "darwin-x86_64"
              else
                "linux-x86_64"
              end
              cd "fj-#{version}-#{target}"
              bin.install "fj"
              pkgshare.install "README.md", "LICENSE", "CHANGELOG.md"
            end

            test do
              assert_match "fj #{version}", shell_output("#{bin}/fj --version")
              assert_match "Command-line tool for Forgejo", shell_output("#{bin}/fj --help")
            end
          end
          RUBY
          echo "Rendered formula:"
          cat homebrew-out/fj.rb

      # Create (or update, if Forgejo auto-created it on the tag push) the
      # release and upload every asset in one step. Replaces the hand-rolled
      # find-or-create + per-asset curl loop.
      - name: publish release
        uses: https://rasterhub.com/rasterstate/forgejo-release-action@v1
        with:
          files: |
            dist/fj-*.tar.gz
            dist/SHA256SUMS
            homebrew-out/fj.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
