name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: docker
    # catthehacker/ubuntu:act-22.04 is the de-facto standard for Forgejo
    # Actions: it has node preinstalled (required by actions/checkout@v4
    # and most JS actions). Rust ships from rustup.rs at job start.
    container:
      image: catthehacker/ubuntu:act-22.04
    # Cargo cache lives on our own S3 (Hetzner), via rust-cache-action ->
    # cache-action. Hetzner needs virtual-hosted addressing, so path-style off.
    env:
      RASTER_CACHE_S3_BUCKET:            ${{ vars.RASTER_CACHE_S3_BUCKET }}
      RASTER_CACHE_S3_ENDPOINT:          ${{ vars.RASTER_CACHE_S3_ENDPOINT }}
      RASTER_CACHE_S3_REGION:            ${{ vars.RASTER_CACHE_S3_REGION }}
      RASTER_CACHE_S3_FORCE_PATH_STYLE:  "false"
      RASTER_CACHE_S3_ACCESS_KEY_ID:     ${{ secrets.SCCACHE_AWS_KEY_ID }}
      RASTER_CACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust
        uses: https://rasterhub.com/rasterstate/setup-rust-action@v1.0.1
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: cache cargo
        uses: https://rasterhub.com/rasterstate/rust-cache-action@v1

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all --locked --no-fail-fast

      - name: install cargo-audit
        run: cargo install cargo-audit --locked --jobs 1

      - name: cargo audit
        # All three are unmaintained-only advisories on transitively pulled
        # crates we don't depend on directly, tracked as known debt; new
        # advisories, yanks, or warnings fail this gate.
        #   RUSTSEC-2024-0370 proc-macro-error (via clap/tabled deriveds)
        #   RUSTSEC-2025-0141 bincode      (via fjord-core -> uniffi_macros)
        #   RUSTSEC-2024-0436 paste        (via fjord-core -> uniffi_core)
        run: cargo audit --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0436 -D warnings

      - name: cargo build --release
        run: cargo build --release --locked

      - name: smoke-check binary
        run: |
          ./target/release/fj --version
          ./target/release/fj --help >/dev/null
          ./target/release/fj completion zsh >/dev/null

  # Intent-precise coverage (handler regions excluded; see the Makefile's
  # COV_IGNORE / coverage-strict). Runs after `check` rather than alongside it
  # so the two heavy compiles don't contend for the runner's memory. The floor
  # fails the build on a real regression; raise COV_MIN as coverage climbs.
  coverage:
    runs-on: docker
    needs: check
    container:
      image: catthehacker/ubuntu:act-22.04
    env:
      RASTER_CACHE_S3_BUCKET:            ${{ vars.RASTER_CACHE_S3_BUCKET }}
      RASTER_CACHE_S3_ENDPOINT:          ${{ vars.RASTER_CACHE_S3_ENDPOINT }}
      RASTER_CACHE_S3_REGION:            ${{ vars.RASTER_CACHE_S3_REGION }}
      RASTER_CACHE_S3_FORCE_PATH_STYLE:  "false"
      RASTER_CACHE_S3_ACCESS_KEY_ID:     ${{ secrets.SCCACHE_AWS_KEY_ID }}
      RASTER_CACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust (stable)
        uses: https://rasterhub.com/rasterstate/setup-rust-action@v1.0.1
        with:
          toolchain: '1.95.0'

      # The coverage(off) regions only take effect on a nightly toolchain
      # (cargo-llvm-cov sets cfg(coverage_nightly) there). Pin the nightly:
      # floating nightly changed coverage accounting on 2026-08-09 and made
      # the gate unreproducible against local `make coverage-strict`.
      # llvm-tools-preview provides the profdata/cov tooling. override:false
      # keeps 1.95.0 default.
      - name: setup rust (nightly for coverage)
        uses: https://rasterhub.com/rasterstate/setup-rust-action@v1.0.1
        with:
          toolchain: nightly-2026-08-07
          components: llvm-tools-preview
          override: 'false'

      - name: cache cargo
        uses: https://rasterhub.com/rasterstate/rust-cache-action@v1

      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: coverage environment
        # Keep the enforced floor tied to the pinned coverage toolchain.
        run: |
          cargo +nightly-2026-08-07 --version
          rustc +nightly-2026-08-07 --version
          cargo llvm-cov --version
          printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS:-}"
          rustup show active-toolchain

      - name: coverage-strict (fails under the floor)
        run: make coverage-strict COV_MIN=71

  live-e2e:
    runs-on: docker
    needs: check
    container:
      image: catthehacker/ubuntu:act-22.04
    env:
      FJ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FJ_E2E_REPO: rasterstate/fj
      XDG_CONFIG_HOME: ${{ github.workspace }}/.xdg-config
      RASTER_CACHE_S3_BUCKET:            ${{ vars.RASTER_CACHE_S3_BUCKET }}
      RASTER_CACHE_S3_ENDPOINT:          ${{ vars.RASTER_CACHE_S3_ENDPOINT }}
      RASTER_CACHE_S3_REGION:            ${{ vars.RASTER_CACHE_S3_REGION }}
      RASTER_CACHE_S3_FORCE_PATH_STYLE:  "false"
      RASTER_CACHE_S3_ACCESS_KEY_ID:     ${{ secrets.SCCACHE_AWS_KEY_ID }}
      RASTER_CACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust
        uses: https://rasterhub.com/rasterstate/setup-rust-action@v1.0.1
        with:
          toolchain: '1.95.0'

      - name: cache cargo
        uses: https://rasterhub.com/rasterstate/rust-cache-action@v1

      - name: build release binary
        run: cargo build --release --locked

      - name: configure ephemeral host
        run: |
          mkdir -p "$XDG_CONFIG_HOME/fj"
          cat > "$XDG_CONFIG_HOME/fj/hosts.toml" <<'TOML'
          current = "rasterhub.com"

          [hosts."rasterhub.com"]
          user = "forgejo-actions"
          git_protocol = "https"
          web_url = "https://rasterhub.com"
          TOML

      - name: live API smoke
        run: scripts/e2e-smoke.sh
