name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: docker
    # catthehacker/ubuntu:act-22.04 is the de-facto standard for Forgejo
    # Actions: it has node preinstalled (required by actions/checkout@v4
    # and most JS actions). Rust ships from rustup.rs at job start.
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: install rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all --locked --no-fail-fast

      - name: cargo build --release
        run: cargo build --release --locked

      - name: smoke-check binary
        run: |
          ./target/release/fj --version
          ./target/release/fj --help >/dev/null
          ./target/release/fj completion zsh >/dev/null
