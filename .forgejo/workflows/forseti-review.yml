name: Forseti review

# Advisory AI code review by Forseti (rasterstate/forseti). Runs the prebuilt
# reviewer image from the rasterstate-ops registry as a trusted job container:
# no source is checked out and nothing is built here, so PR-controlled code
# never runs in the key-bearing job. Provider keys and registry creds are
# inherited from rasterstate org secrets.
on:
  # Re-review on every push, but cancel-in-progress (below) collapses a burst
  # of pushes into a single review, and the reviewer runs on Haiku (see the
  # FORSETI_ANTHROPIC_MODEL env), so cost stays low. `synchronize` is kept so
  # lanes do NOT close/reopen the PR to force a re-review: a close cancels the
  # in-flight fjord-apple Apple validation as collateral.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  # write (was read) so Forseti can submit a formal pull review
  # (REQUEST_CHANGES / APPROVE), not just an issue comment.
  pull-requests: write

concurrency:
  group: forseti-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: forseti review (advisory)
    # Same-repo PRs only: a fork PR must never reach the provider keys. The
    # pull_request_target trigger runs this base-ref workflow, which a PR head
    # cannot redefine.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    timeout-minutes: 12
    container:
      image: rasterhub.com/rasterstate-ops/forseti-review:stable
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Assert trusted trigger and allowlist
        run: |
          if [ "${{ github.event_name }}" != "pull_request_target" ]; then
            echo "forseti review must run from pull_request_target" >&2
            exit 1
          fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "fork PRs are not allowlisted for the provider-key review" >&2
            exit 1
          fi

      # The only key-bearing step. It runs the prebuilt, trusted forseti-review
      # binary over the PR diff fetched from the Forgejo API as data; it does not
      # check out, build, or run PR-authored code.
      - name: Forseti review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Cost control: run the adversarial reviewer on Haiku 4.5 instead of
          # the pricey Opus the stable image defaults to. Overrides the image
          # default via forseti's FORSETI_ANTHROPIC_MODEL knob (provider.rs).
          FORSETI_ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          # Phase 1 (visibility): submit a formal Forgejo review so a blocking
          # P0/P1 shows as a red "changes requested" state in the PR list and
          # clears to APPROVE on a clean re-review, instead of reviews: NONE.
          # fj main does NOT block on rejected reviews, so this stays purely
          # visible-non-blocking until FORSETI_GATE is turned on (Phase 2).
          FORSETI_FORMAL_REVIEW: "1"
        run: forseti-review
