[package]
name = "fj"
version = "0.4.1"
edition = "2021"
rust-version = "1.95"
description = "Command-line tool for Forgejo, in the spirit of gh"
authors = ["Raster & State <support@rasterstate.com>"]
license = "MIT"
repository = "https://rasterhub.com/rasterstate/fj"
readme = "README.md"

[[bin]]
name = "fj"
path = "src/main.rs"

[lints.rust]
# Set by cargo-llvm-cov on a nightly toolchain; used to gate the
# `coverage_attribute` feature so `make coverage-strict` can drop the
# untested async command handlers from the report. Declare it so it isn't
# flagged as an unexpected cfg on stable builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[dependencies]
anyhow = "1"
base64 = "0.22"
# Shared product/domain layer (fjord-architecture ADR 0001). fj is the first
# consumer and validates each promoted workflow before the GUI surfaces adopt it.
fjord-core = { version = "0.1.2", registry = "fjord" }
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "suggestions"] }
clap_complete = "4.5"
clap_mangen = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "io-std", "net", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.8"
directories = "5"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
tabled = { version = "0.16", features = ["ansi"] }
owo-colors = { version = "4", features = ["supports-colors"] }
supports-color = "3"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
libc = "0.2"
tempfile = "3"
shlex = "1.3"
# PKCE for the Fjord Account OIDC sign-in (loopback + authorization code).
# Both are already in the tree via reqwest's rustls-tls stack, so declaring
# them direct adds no new compiled crates: `getrandom` mints the code
# verifier / state / nonce, `ring` computes the S256 code challenge.
getrandom = "0.2"
ring = "0.17"
# Terminal QR code for the OAuth device-flow sign-in (`--device`): renders the
# verification URL as scannable Unicode blocks so a phone/iPad can jump straight
# to the approval page. `default-features = false` drops the image/svg encoders
# we don't use, leaving just the pure-Rust string renderer.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[profile.dist]
inherits = "release"
